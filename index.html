<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金門話性別平等｜離線對對碰（數字牌背）</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#263348;font-family:Arial,'Microsoft JhengHei','PingFang TC',sans-serif;padding:20px 12px 40px}.wrap{max-width:1100px;margin:auto}h1{text-align:center;font-size:clamp(24px,4vw,38px);margin:12px 0}p{text-align:center;line-height:1.6}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}.controls button{background:#fff;border:2px solid #a9b6ce;border-radius:12px;padding:12px 17px;font-size:17px;font-weight:bold;cursor:pointer}.controls button:focus-visible,.card:focus-visible{outline:3px solid #2247b8;outline-offset:3px}.status{font-weight:bold;color:#526079}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:250px;aspect-ratio:1;border:3px solid var(--accent);border-radius:18px;background:#fff;padding:16px 12px;text-align:center;cursor:pointer;color:#253047;box-shadow:0 3px 0 #e8eaf0}.card.revealed{background:var(--pale)}.number{font-size:16px;color:var(--accent);font-weight:bold;margin-bottom:12px}.symbol{font-size:45px;line-height:1.3;margin:8px 0}.words{font-size:clamp(19px,2.1vw,26px);line-height:1.5;font-weight:800;overflow-wrap:break-word;word-break:normal;white-space:normal}.card.revealed .words{font-size:clamp(19px,2vw,25px)}.tip{font-size:13px;color:#66748a;margin-top:12px}.footer{color:#647084;font-size:14px;margin-top:24px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:230px}.words,.card.revealed .words{font-size:clamp(19px,3vw,27px)}}@media(max-width:420px){.grid{gap:9px}.card{padding:12px 8px;min-height:190px;border-radius:13px}.words,.card.revealed .words{font-size:clamp(16px,4.3vw,20px)}.symbol{font-size:30px}.number{font-size:13px;margin-bottom:6px}.tip{font-size:11px;margin-top:6px}}@media print{.controls,.tip{display:none}.grid{grid-template-columns:repeat(4,1fr)}.card{box-shadow:none;min-height:200px}body{padding:5px}}
 .card.face-down{background:#f6f9ff;border-color:#a3b5d4}.card.face-down .symbol{font-size:54px}.card.face-down .back-number{font-size:clamp(56px,8vw,94px);font-weight:900;line-height:1;color:#345ca3}.card.face-down .tip{font-size:15px}.card.matched{visibility:hidden;pointer-events:none}.card.match-up{background:var(--pale)}.card .words{overflow-wrap:anywhere}.card:disabled{cursor:default}.matchlabel{font-size:14px;font-weight:800;color:#526079;margin-bottom:10px}#study{display:none}@media(max-width:420px){.card.face-down .symbol{font-size:40px}.matchlabel{font-size:12px}} </style></head><body><main class="wrap"><h1>🌈 金門話性別平等翻翻樂</h1><p>翻翻卡可練習金門話；按「對對碰洗牌」，隨機抽出四組國語與金門話卡片，找出對應配對！蓋著的牌卡會顯示 1～8 號，方便學生指定翻牌。</p><div class="controls"><button id="show">👀 全部翻開</button><button id="hide">↩ 全部蓋回</button><button id="match">🧩 對對碰洗牌</button><button id="study">📖 返回翻翻卡</button></div><p class="status" id="status">已翻開 0／8 張</p><section id="grid" class="grid" aria-label="翻翻樂卡片"></section><p class="footer">單一 HTML 離線版｜不需安裝或連線｜適用手機、平板、電腦</p></main><script>
const data=[
[1,'職業不分性別','查埔查某，攏會使做家己佮意的頭路','👩‍⚕️ 👨‍🍳','#c43b72','#fff4f8'],
[2,'興趣不受限制','查埔查某，攏會使有家己的興趣','⚽ 🩰','#2477bd','#f1f8ff'],
[3,'家事一起做','厝內的家事，逐家相佮做','🧹 🧽','#b66c15','#fff8ee'],
[4,'勇敢表達自己','家己的想法，勇敢講出來','💬 🙋','#7950b4','#f9f5ff'],
[5,'尊重身體界線','家己的身軀，家己做主','✋ 💗','#25835b','#f1fff7'],
[6,'拒絕性別嘲笑','查埔查某攏平等，毋通笑人','🤝 💛','#b94169','#fff5f8'],
[7,'公平參與活動','毋管查埔查某，逐家攏有機會','🏃 🏀','#087e91','#f1fcff'],
[8,'尊重每個人的夢想','逐个人的夢想，攏愛尊重','🚀 ⭐','#7950b4','#f9f5ff']];
let cards=data.slice(), opened=new Set(), mode='study', matchCards=[], selected=[], matched=new Set(), busy=false, moves=0, timeoutId=null;
const grid=document.getElementById('grid'), status=document.getElementById('status');
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function make(tag,cls,value){const el=document.createElement(tag);el.className=cls;el.textContent=value;return el}
function renderStudy(){grid.textContent='';for(const c of cards){const b=make('button','card'+(opened.has(c[0])?' revealed':''),'');b.type='button';b.style.setProperty('--accent',c[4]);b.style.setProperty('--pale',c[5]);b.setAttribute('aria-pressed',String(opened.has(c[0])));b.append(make('div','number',`第 ${c[0]} 張｜${opened.has(c[0])?'金門話':'國語'}`),make('div','symbol',c[3]),make('div','words',opened.has(c[0])?c[2]:c[1]),make('div','tip',opened.has(c[0])?'點一下蓋回':'點一下看金門話'));b.onclick=()=>{opened.has(c[0])?opened.delete(c[0]):opened.add(c[0]);renderStudy()};grid.append(b)}status.textContent=`已翻開 ${opened.size}／8 張`}
function startMatch(){if(timeoutId)clearTimeout(timeoutId);timeoutId=null;mode='match';selected=[];matched=new Set();busy=false;moves=0;const picked=shuffleArray(data.slice()).slice(0,4);matchCards=shuffleArray(picked.flatMap(c=>[{id:c[0]+'-zh',pair:c[0],side:'國語',text:c[1],color:c[4],pale:c[5]},{id:c[0]+'-km',pair:c[0],side:'金門話',text:c[2],color:c[4],pale:c[5]}]));document.getElementById('study').style.display='inline-block';renderMatch()}
function renderMatch(){grid.textContent='';for(const [index,c] of matchCards.entries()){const gone=matched.has(c.pair),up=selected.includes(c.id);const b=make('button','card'+(gone?' matched':up?' match-up':' face-down'),'');b.type='button';b.disabled=gone||busy&& !up;b.style.setProperty('--accent',c.color);b.style.setProperty('--pale',c.pale);b.setAttribute('aria-label',gone?'已配對':up?c.side+'：'+c.text:`第 ${index+1} 號牌，尚未翻開`);if(gone){b.append(make('div','words',''))}else if(up){b.append(make('div','matchlabel',c.side),make('div','words',c.text))}else{b.append(make('div','back-number',String(index+1)),make('div','tip','請選號碼翻牌'))}b.onclick=()=>flip(c);grid.append(b)}status.textContent=matched.size===4?`🎉 全部配對成功！共翻了 ${moves} 回合。按「對對碰洗牌」再玩一次。`:`對對碰｜已找到 ${matched.size}／4 組・翻牌 ${moves} 回合（國語配金門話）`}
function flip(c){if(mode!=='match'||busy||matched.has(c.pair)||selected.includes(c.id)||selected.length>=2)return;selected.push(c.id);if(selected.length===2){moves++;const a=matchCards.find(x=>x.id===selected[0]);if(a.pair===c.pair&&a.side!==c.side){busy=true;renderMatch();timeoutId=setTimeout(()=>{matched.add(c.pair);selected=[];busy=false;renderMatch()},650)}else{busy=true;renderMatch();timeoutId=setTimeout(()=>{selected=[];busy=false;renderMatch()},1250)} }else renderMatch()}
function backStudy(){if(timeoutId)clearTimeout(timeoutId);timeoutId=null;mode='study';busy=false;document.getElementById('study').style.display='none';renderStudy()}
document.getElementById('match').onclick=startMatch;
document.getElementById('study').onclick=backStudy;
document.getElementById('show').onclick=()=>{backStudy();opened=new Set(data.map(c=>c[0]));renderStudy()};
document.getElementById('hide').onclick=()=>{backStudy();opened.clear();renderStudy()};

renderStudy();
</script></body></html>
